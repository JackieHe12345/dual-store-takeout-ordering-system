# Limit repeated sign-in/registration attempts; other requests use an empty key.
map $uri $login_limit_key {
    default "";
    ~/(auth/login|commerce/members/(login|register))$ "$binary_remote_addr:$uri";
}
limit_req_zone $login_limit_key zone=login_attempts:10m rate=30r/m;

upstream takeaway_backend {
    server backend:8000;
}

# Each public path is assigned a fixed internal host. The backend rechecks account scope.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10m;
    absolute_redirect off;
    server_tokens off;
    limit_req zone=login_attempts burst=30 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location = / {
        default_type text/plain;
        charset utf-8;
        return 200 '门店入口已就绪。请使用指定的门店网址访问。\n';
    }
    location /media/ {
        alias /usr/share/nginx/html/media/;
        autoindex off;
    }

    location = /Adiandiancan { return 308 /Adiandiancan/; }
    location ^~ /Adiandiancan/api/ {
        proxy_pass http://takeaway_backend/api/;
        proxy_set_header Host shop-a.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /Adiandiancan/index.html {
        alias /usr/share/nginx/html/customer/index.html;
        expires -1;
    }
    location ^~ /Adiandiancan/ {
        alias /usr/share/nginx/html/customer/;
        autoindex off;
    }

    location = /Bdiandiancan { return 308 /Bdiandiancan/; }
    location ^~ /Bdiandiancan/api/ {
        proxy_pass http://takeaway_backend/api/;
        proxy_set_header Host shop-b.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /Bdiandiancan/index.html {
        alias /usr/share/nginx/html/customer/index.html;
        expires -1;
    }
    location ^~ /Bdiandiancan/ {
        alias /usr/share/nginx/html/customer/;
        autoindex off;
    }

    location = /Adianneibuguanli { return 308 /Adianneibuguanli/; }
    location ^~ /Adianneibuguanli/api/ {
        proxy_pass http://takeaway_backend/api/;
        proxy_set_header Host staff-a.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /Adianneibuguanli/index.html {
        alias /usr/share/nginx/html/staff/index.html;
        expires -1;
    }
    location ^~ /Adianneibuguanli/ {
        alias /usr/share/nginx/html/staff/;
        autoindex off;
    }

    location = /Bdianneibuguanli { return 308 /Bdianneibuguanli/; }
    location ^~ /Bdianneibuguanli/api/ {
        proxy_pass http://takeaway_backend/api/;
        proxy_set_header Host staff-b.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /Bdianneibuguanli/index.html {
        alias /usr/share/nginx/html/staff/index.html;
        expires -1;
    }
    location ^~ /Bdianneibuguanli/ {
        alias /usr/share/nginx/html/staff/;
        autoindex off;
    }

    location = /neibuguanli { return 308 /neibuguanli/; }
    location ^~ /neibuguanli/api/ {
        proxy_pass http://takeaway_backend/api/;
        proxy_set_header Host admin.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /neibuguanli/index.html {
        alias /usr/share/nginx/html/admin/index.html;
        expires -1;
    }
    location ^~ /neibuguanli/ {
        alias /usr/share/nginx/html/admin/;
        autoindex off;
    }

    # Never route a bare /api request using a caller-supplied host or store_id.
    location / { return 404; }
}
